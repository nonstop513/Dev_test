<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票查詢 | Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --card: #1e2130; --border: rgba(255,255,255,0.08);
      --accent: #7c6ef2; --text: #e8eaf0; --muted: #7a7f9a;
      --green: #3ecf8e; --red: #f25e7c;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 1.1rem; }
    .back { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
    .back:hover { color: var(--accent); }
    main { padding: 40px; max-width: 960px; margin: 0 auto; }

    /* 搜尋列 */
    .search-bar { display: flex; gap: 12px; margin-bottom: 16px; }
    .search-bar input[type="text"] {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 1rem; padding: 12px 16px; outline: none;
    }
    .search-bar input[type="text"]:focus { border-color: var(--accent); }
    .search-bar input[type="text"]::placeholder { color: var(--muted); }
    .search-bar button {
      background: var(--accent); border: none; border-radius: 10px;
      color: #fff; font-size: 1rem; font-weight: 600; padding: 12px 28px; cursor: pointer;
    }
    .search-bar button:hover { background: #6a5de0; }
    .search-bar button:disabled { background: #444; cursor: not-allowed; }

    /* 快捷標籤 */
    .shortcuts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tag { background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 5px 14px; transition: all 0.15s; }
    .tag:hover { border-color: var(--accent); color: var(--accent); }

    /* 日期區間列 */
    .date-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
    .range-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .range-btn {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); cursor: pointer; font-size: 0.82rem; padding: 6px 14px; transition: all 0.15s;
    }
    .range-btn:hover, .range-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .date-divider { color: var(--border); font-size: 1.2rem; }
    .date-inputs { display: flex; align-items: center; gap: 8px; }
    .date-inputs input[type="date"] {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.85rem; padding: 6px 10px; outline: none;
      color-scheme: dark;
    }
    .date-inputs input[type="date"]:focus { border-color: var(--accent); }
    .date-inputs span { color: var(--muted); font-size: 0.85rem; }
    .apply-btn {
      background: transparent; border: 1px solid var(--accent); border-radius: 8px;
      color: var(--accent); cursor: pointer; font-size: 0.82rem; padding: 6px 14px;
    }
    .apply-btn:hover { background: var(--accent); color: #fff; }

    /* 股票資訊卡 */
    .stock-info { display: none; }
    .info-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .info-card .label { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
    .info-card .value { font-size: 1.4rem; font-weight: 700; }
    .info-card .value.up { color: var(--green); }
    .info-card .value.down { color: var(--red); }

    /* 圖表 */
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .chart-header h3 { font-size: 0.9rem; color: var(--muted); }
    .chart-header .date-range-label { font-size: 0.78rem; color: var(--muted); }
    .chart-wrap { position: relative; height: 300px; }

    /* 訊息 */
    #message { color: var(--muted); font-size: 0.95rem; text-align: center; margin-top: 60px; }
  </style>
</head>
<body>
  <header>
    <h1>📈 股票走勢查詢</h1>
    <a class="back" href="/portal.html">← 返回大廳</a>
  </header>
  <main>

    <!-- 搜尋列 -->
    <div class="search-bar">
      <input id="symbolInput" type="text" placeholder="輸入股票代碼，例如：AAPL、2330.TW、8299.TWO" />
      <button id="searchBtn">查詢</button>
    </div>

    <!-- 快捷標籤 -->
    <div class="shortcuts">
      <span class="tag" data-symbol="AAPL">AAPL 蘋果</span>
      <span class="tag" data-symbol="TSLA">TSLA 特斯拉</span>
      <span class="tag" data-symbol="NVDA">NVDA 輝達</span>
      <span class="tag" data-symbol="2330.TW">2330 台積電</span>
      <span class="tag" data-symbol="2317.TW">2317 鴻海</span>
      <span class="tag" data-symbol="8299.TWO">8299 群聯</span>
      <span class="tag" data-symbol="^GSPC">S&P 500</span>
    </div>

    <!-- 日期區間 -->
    <div class="date-row">
      <div class="range-btns">
        <button class="range-btn active" data-range="10d">10 天</button>
        <button class="range-btn" data-range="1mo">1 個月</button>
        <button class="range-btn" data-range="3mo">3 個月</button>
        <button class="range-btn" data-range="6mo">6 個月</button>
        <button class="range-btn" data-range="1y">1 年</button>
        <button class="range-btn" data-range="custom">自訂</button>
      </div>
      <div class="date-inputs" id="customDateInputs" style="display:none;">
        <span>從</span>
        <input type="date" id="startDate" />
        <span>到</span>
        <input type="date" id="endDate" />
        <button class="apply-btn" id="applyDate">套用</button>
      </div>
    </div>

    <p id="message">請輸入股票代碼開始查詢</p>

    <!-- 股票資訊 -->
    <div class="stock-info" id="stockInfo">
      <div class="info-cards">
        <div class="info-card">
          <div class="label">股票名稱</div>
          <div class="value" id="stockName" style="font-size:1rem;">—</div>
        </div>
        <div class="info-card">
          <div class="label">最新收盤價</div>
          <div class="value" id="currentPrice">—</div>
        </div>
        <div class="info-card">
          <div class="label">區間漲跌</div>
          <div class="value" id="todayChange">—</div>
        </div>
        <div class="info-card">
          <div class="label">區間漲跌幅</div>
          <div class="value" id="changePercent">—</div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <h3 id="chartTitle">股價走勢</h3>
          <span class="date-range-label" id="dateRangeLabel"></span>
        </div>
        <div class="chart-wrap">
          <canvas id="priceChart"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script>
    let chart = null;
    let currentSymbol = '';
    let currentRange = '10d';
    let customStart = '';
    let customEnd = '';

    // ── 初始化日期（今天 & 10天前）
    const today = new Date();
    const tenDaysAgo = new Date(today);
    tenDaysAgo.setDate(today.getDate() - 10);
    document.getElementById('endDate').value = formatDate(today);
    document.getElementById('startDate').value = formatDate(tenDaysAgo);

    function formatDate(d) {
      return d.toISOString().split('T')[0];
    }

    // ── 快捷標籤
    document.querySelectorAll('.tag').forEach(tag => {
      tag.addEventListener('click', () => {
        document.getElementById('symbolInput').value = tag.dataset.symbol;
        doSearch();
      });
    });

    // ── 搜尋按鈕 & Enter
    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('symbolInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    // ── 區間按鈕
    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRange = btn.dataset.range;

        const customInputs = document.getElementById('customDateInputs');
        if (currentRange === 'custom') {
          customInputs.style.display = 'flex';
        } else {
          customInputs.style.display = 'none';
          if (currentSymbol) doSearch();
        }
      });
    });

    // ── 套用自訂日期
    document.getElementById('applyDate').addEventListener('click', () => {
      customStart = document.getElementById('startDate').value;
      customEnd = document.getElementById('endDate').value;
      if (!customStart || !customEnd) return alert('請選擇開始和結束日期');
      if (customStart > customEnd) return alert('開始日期不能晚於結束日期');
      if (currentSymbol) doSearch();
    });

    function doSearch() {
      const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
      if (!symbol) return;
      currentSymbol = symbol;
      fetchStock();
    }

    async function fetchStock() {
      const btn = document.getElementById('searchBtn');
      const msg = document.getElementById('message');
      const info = document.getElementById('stockInfo');

      btn.disabled = true;
      msg.style.display = 'block';
      msg.textContent = '查詢中...';
      info.style.display = 'none';

      try {
        // 組 API 參數
        let url = `/api/stock?symbol=${encodeURIComponent(currentSymbol)}`;
        if (currentRange === 'custom' && customStart && customEnd) {
          const p1 = Math.floor(new Date(customStart).getTime() / 1000);
          const p2 = Math.floor(new Date(customEnd + 'T23:59:59').getTime() / 1000);
          url += `&period1=${p1}&period2=${p2}`;
        } else {
          url += `&range=${currentRange}`;
        }

        const res = await fetch(url);
        const json = await res.json();
        if (json.error) throw new Error(json.error);

        const result = json.chart.result[0];
        const meta = result.meta;
        const timestamps = result.timestamp;
        const closes = result.indicators.quote[0].close;

        const validData = timestamps
          .map((ts, i) => ({ date: ts, price: closes[i] }))
          .filter(d => d.price !== null);

        if (validData.length === 0) throw new Error('此區間無交易資料');

        const labels = validData.map(d => {
          const date = new Date(d.date * 1000);
          return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
        });
        const prices = validData.map(d => parseFloat(d.price.toFixed(2)));

        // 漲跌（區間首尾比較）
        const first = validData[0].price;
        const latest = validData[validData.length - 1].price;
        const change = latest - first;
        const changePct = ((change / first) * 100).toFixed(2);
        const isUp = change >= 0;

        // 日期區間標籤
        const startLabel = labels[0];
        const endLabel = labels[labels.length - 1];
        document.getElementById('dateRangeLabel').textContent = `${startLabel} ～ ${endLabel}`;

        document.getElementById('stockName').textContent = meta.shortName ?? currentSymbol;
        document.getElementById('currentPrice').textContent = `${meta.currency ?? ''} ${latest.toFixed(2)}`;
        document.getElementById('todayChange').textContent = `${isUp ? '+' : ''}${change.toFixed(2)}`;
        document.getElementById('todayChange').className = `value ${isUp ? 'up' : 'down'}`;
        document.getElementById('changePercent').textContent = `${isUp ? '+' : ''}${changePct}%`;
        document.getElementById('changePercent').className = `value ${isUp ? 'up' : 'down'}`;
        document.getElementById('chartTitle').textContent = `${meta.shortName ?? currentSymbol} 股價走勢`;

        // 圖表
        if (chart) chart.destroy();
        const ctx = document.getElementById('priceChart').getContext('2d');
        const color = isUp ? '#3ecf8e' : '#f25e7c';
        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: '收盤價',
              data: prices,
              borderColor: color,
              backgroundColor: color + '22',
              borderWidth: 2,
              pointRadius: validData.length > 60 ? 0 : 4,
              pointBackgroundColor: color,
              fill: true,
              tension: 0.3,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => ` ${meta.currency ?? ''} ${ctx.parsed.y.toFixed(2)}`
                }
              }
            },
            scales: {
              x: {
                ticks: {
                  color: '#7a7f9a',
                  maxTicksLimit: 8,
                  maxRotation: 0,
                },
                grid: { color: 'rgba(255,255,255,0.05)' }
              },
              y: {
                ticks: { color: '#7a7f9a' },
                grid: { color: 'rgba(255,255,255,0.05)' }
              },
            }
          }
        });

        msg.style.display = 'none';
        info.style.display = 'block';
      } catch (e) {
        msg.textContent = `查詢失敗：${e.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
