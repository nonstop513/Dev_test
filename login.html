<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 | Slot Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e2130;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 28px; text-align: center; }
    label { display: block; font-size: 0.85rem; color: #7a7f9a; margin-bottom: 6px; }
    input {
      width: 100%;
      background: #0f1117;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #e8eaf0;
      font-size: 1rem;
      padding: 10px 14px;
      margin-bottom: 18px;
      outline: none;
    }
    input:focus { border-color: #7c6ef2; }
    button {
      width: 100%;
      background: #7c6ef2;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
    }
    button:hover { background: #6a5de0; }
    #error { color: #f25e7c; font-size: 0.85rem; margin-top: 12px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Slot Portal</h1>
    <label for="username">帳號</label>
    <input id="username" type="text" placeholder="請輸入帳號" autocomplete="username">
    <label for="password">密碼</label>
    <input id="password" type="password" placeholder="請輸入密碼" autocomplete="current-password">
    <button id="loginBtn">登入</button>
    <p id="error">帳號或密碼錯誤</p>
  </div>

  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) {
          window.location.href = '/portal.html';
        } else {
          errorEl.style.display = 'block';
        }
      } catch {
        errorEl.textContent = '連線失敗，請稍後再試';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
