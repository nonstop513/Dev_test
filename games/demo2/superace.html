                // 第二層：決定具體的場次配置
                
                console.log('🎯 [JL雙層抽選] 開始第一層抽選：平均 vs 專一');
                
                // 計算平均選擇 (symbolType=0) 的總權重
                const averageWeight = highSurface[0].reduce((sum, val) => sum + val, 0);
                
                // 計算專一選擇 (symbolType=1,2,3,4) 的總權重
                const exclusiveWeight = highSurface[1].reduce((sum, val) => sum + val, 0) +
                                      highSurface[2].reduce((sum, val) => sum + val, 0) +
                                      highSurface[3].reduce((sum, val) => sum + val, 0) +
                                      highSurface[4].reduce((sum, val) => sum + val, 0);
                
                const firstLayerTotalWeight = averageWeight + exclusiveWeight;
                console.log('🎯 [JL雙層抽選] 第一層權重:', {
                    平均選擇: averageWeight,
                    專一選擇: exclusiveWeight,
                    總權重: firstLayerTotalWeight
                });
                
                if (firstLayerTotalWeight === 0) {
                    console.log('🎯 [JL雙層抽選] 第一層總權重為0，使用預設設定');
                    return { symbolType: 0, config: 3 };
                }
                
                const firstLayerRandom = Math.random() * firstLayerTotalWeight;
                console.log('🎯 [JL雙層抽選] 第一層隨機值:', firstLayerRandom);
                
                let selectedCategory;
                if (firstLayerRandom <= averageWeight) {
                    selectedCategory = 'average';
                    console.log('🎯 [JL雙層抽選] ✅ 第一層選中：平均選擇');
                } else {
                    selectedCategory = 'exclusive';
                    console.log('🎯 [JL雙層抽選] ✅ 第一層選中：專一選擇');
                }
                
                // 第二層抽選：根據第一層結果進行具體配置選擇
                console.log('🎯 [JL雙層抽選] 開始第二層抽選：具體配置');
                
                if (selectedCategory === 'average') {
                    // 平均選擇：在symbolType=0的11個配置中選擇
                    const configs = highSurface[0];
                    const configTotalWeight = configs.reduce((sum, val) => sum + val, 0);
                    
                    if (configTotalWeight === 0) {
                        console.log('🎯 [JL雙層抽選] 平均選擇配置權重為0，使用預設config=3');
                        return { symbolType: 0, config: 3 };
                    }
                    
                    const configRandom = Math.random() * configTotalWeight;
                    console.log('🎯 [JL雙層抽選] 平均選擇配置隨機值:', configRandom);
                    
                    let cumulative = 0;
                    for (let config = 0; config < configs.length; config++) {
                        cumulative += configs[config];
                        if (configRandom <= cumulative) {
                            console.log(`🎯 [JL雙層抽選] ✅ 第二層選中：平均選擇, config=${config}`);
                            return { symbolType: 0, config };

                    // 回退

                    return { symbolType: 0, config: 3 };
                    
                } else {
                    // 專一選擇：在symbolType=1,2,3,4中選擇
                    const exclusiveTypes = [1, 2, 3, 4];
                    const exclusiveWeights = exclusiveTypes.map(type => 
                        highSurface[type].reduce((sum, val) => sum + val, 0)

                    const exclusiveTypeTotalWeight = exclusiveWeights.reduce((sum, val) => sum + val, 0);
                    
                    if (exclusiveTypeTotalWeight === 0) {

                    // 選擇專一類型
                    let typeCumulative = 0;
                    let selectedSymbolType = 1;
                    for (let i = 0; i < exclusiveTypes.length; i++) {
                        typeCumulative += exclusiveWeights[i];
                        if (typeRandom <= typeCumulative) {
                            selectedSymbolType = exclusiveTypes[i];
                            break;
                        }
                    }
                    
                    console.log(`🎯 [JL雙層抽選] ✅ 選中專一類型：symbolType=${selectedSymbolType}`);
                    
                    // 在選中的專一類型中選擇配置
                    const selectedConfigs = highSurface[selectedSymbolType];
                    const selectedConfigTotalWeight = selectedConfigs.reduce((sum, val) => sum + val, 0);
                    
                    if (selectedConfigTotalWeight === 0) {

                    const selectedConfigRandom = Math.random() * selectedConfigTotalWeight;
                    console.log(`🎯 [JL雙層抽選] 專一類型${selectedSymbolType}配置隨機值:`, selectedConfigRandom);
                    
                    let configCumulative = 0;
                    for (let config = 0; config < selectedConfigs.length; config++) {

                        if (selectedConfigRandom <= configCumulative) {
                            console.log(`🎯 [JL雙層抽選] ✅ 第二層選中：專一類型${selectedSymbolType}, config=${config}`);
                            return { symbolType: selectedSymbolType, config };
                        }
                    }
                    
                    // 回退
                    console.log(`🎯 [JL雙層抽選] 專一類型${selectedSymbolType}回退到config=3`);
                    return { symbolType: selectedSymbolType, config: 3 };
                }

            getSymbolTypeName(symbolType) {
                // 獲取符號類型的描述名稱
                switch (symbolType) {
                    case -10: return '免費遊戲低表';
                    case -2: return 'Buy Feature低表';
                    case -1: return 'Buy Feature高表';
                    case 0: 
                        if (this.gameMode === 'yb') {
                            return 'AKQJ混合';
                        } else {
                            return '平均選擇';
                        }
                    case 1: 
                        return this.gameMode === 'jl' ? '純A高表' : '純A高表';
                    case 2: 
                        return this.gameMode === 'jl' ? '純K高表' : '純K高表';
                    case 3: 
                        return this.gameMode === 'jl' ? '純Q高表' : '純Q高表';
                    case 4: 
                        return this.gameMode === 'jl' ? '純J高表' : '純J高表';
                    default: return `未知類型${symbolType}`;
                }
            }
            
            getDetailedSymbolTypeName(symbolType) {
                // 獲取詳細的符號類型描述，包括具體抽到的高表
                if (symbolType === -10) {
                    return '低表場次';
                } else if (symbolType === -1) {
                    return 'Buy Feature高表';
                } else if (symbolType === -2) {
                    return 'Buy Feature低表';
                } else if (this.gameMode === 'yb' && symbolType >= 1 && symbolType <= 4) {
                    // YB版本：symbolType 1=A, 2=K, 3=Q, 4=J
                    const baseNames = ['A', 'K', 'Q', 'J'];
                    const baseName = baseNames[symbolType - 1]; // 減1因為symbolType從1開始
                    return `AKQJ混合 (抽到${baseName}高表)`;
                }
                return this.getSymbolTypeName(symbolType);
            }

            mapIndexToSymbol(index) {
                // Map weight matrix index to actual symbol
                // This mapping matches the order used in simulation.py
                const symbolMapping = [
                    'WILD',   // 0
                    'WILD2',  // 1
                    'C1',     // 2
                    'M1', 'M2', 'M3', 'M4',  // 3-6
                    'A', 'K', 'Q', 'J',      // 7-10
                    'M1_G', 'M2_G', 'M3_G', 'M4_G',  // 11-14
                    'A_G', 'K_G', 'Q_G', 'J_G'       // 15-18
                ];
                
                // 處理無效輸入
                if (index === undefined || index === null || isNaN(index)) {
                    console.warn('mapIndexToSymbol received invalid index:', index, 'type:', typeof index);
                    return 'error'; // 回退到錯誤符號
                }
                
                // 確保index是整數
                const numIndex = Math.round(Number(index));
                
                // 處理特殊的error符號索引
                if (numIndex === -1) {
                    return 'error';
                }
                
                if (numIndex >= 0 && numIndex < symbolMapping.length) {
                    return symbolMapping[numIndex];
                }
                
                console.warn('mapIndexToSymbol received out-of-range index:', numIndex, 'original:', index);
                // If index exceeds mapping, use fallback
                return 'error'; // Default fallback symbol
            }

            bindEvents() {
                // Mode selector
                document.getElementById('game-mode').addEventListener('change', (e) => {
                    this.gameMode = e.target.value;
                    this.setupModeParameters();
                    this.updateGameStateDisplay();
                    console.log(`切換到 ${this.gameMode === 'yb' ? 'YB版本' : 'JL版本'}`);
                });

                document.getElementById('spin-btn').addEventListener('click', () => this.spin());
                document.getElementById('bet-plus').addEventListener('click', () => this.adjustBet(50));
                document.getElementById('bet-minus').addEventListener('click', () => this.adjustBet(-50));
                document.getElementById('auto-btn').addEventListener('click', () => this.toggleAutoSpin());
                
                // Buy feature button
                document.getElementById('buy-feature-btn').addEventListener('click', () => {
                    this.buyFreegame();
                });
                
                // Add money button
                document.getElementById('add-money-btn').addEventListener('click', () => {
                    this.addMoney();
                });
                
                // Add keyboard event listener for spacebar
                document.addEventListener('keydown', (event) => {
                    if (event.code === 'Space') {
                        event.preventDefault(); // Prevent page scroll
                        if (!this.isAutoSpin) {
                            this.spin();
                        }
                    }
                });
                
                // Initialize display
                this.updateGameStateDisplay();
            }

            updateGameStateDisplay() {
                document.getElementById('current-mode-display').textContent = 
                    this.gameMode === 'yb' ? 'YB版本' : 'JL版本';
                document.getElementById('game-phase-display').textContent = 
                    this.gamePhase === 'basegame' ? '基礎遊戲' : `免費遊戲 (${this.freeGameSpinsRemaining}局)`;
                document.getElementById('c1-count-display').textContent = this.c1Count;
                
                // Update buy feature button
                const buyBtn = document.getElementById('buy-feature-btn');
                if (buyBtn) {
                    const canBuyFeature = this.gamePhase === 'basegame' && 
                                        this.balance >= this.buyFeatureCost; // 使用固定金額
                    buyBtn.disabled = !canBuyFeature;
                }
            }

            adjustBet(amount) {
                if (this.isSpinning || this.isAutoSpin) return;
                
                this.currentBet = Math.max(50, Math.min(this.balance, this.currentBet + amount));
                this.updateDisplay();
            }

            addMoney() {
                this.balance += 10000;
                this.updateDisplay();
                console.log('補充金錢 +10000，當前餘額:', this.balance);
                
                // 顯示補充金錢的提示
                const resultContent = document.getElementById('result-content');
                const tempMessage = document.createElement('div');
                tempMessage.style.cssText = 'color: #27ae60; font-weight: bold; margin-top: 10px;';
                tempMessage.textContent = '💰 補充金錢 +10,000！';
                resultContent.appendChild(tempMessage);
                
                // 3秒後移除提示
                setTimeout(() => {
                    if (tempMessage.parentNode) {
                        tempMessage.parentNode.removeChild(tempMessage);
                    }
                }, 3000);
            }

            async spin() {
                if (this.isSpinning) return;
                
                // 免費遊戲期間不收費，基礎遊戲才檢查餘額並扣費
                if (this.gamePhase === 'basegame' && this.balance < this.currentBet) return;

                this.isSpinning = true;
                
                // 重置當前旋轉的獲勝金額
                this.lastSpinWin = 0;
                
                // 重置C1計數（每次旋轉重新計算，不累積）
                if (this.gamePhase === 'basegame') {
                    this.c1Count = 0;
                }
                
                // 只有基礎遊戲才扣費
                if (this.gamePhase === 'basegame') {
                    this.balance -= this.currentBet;
                }
                
                this.resetMultiplier();
                this.resetRandomwildState();
                this.updateDisplay();

                this.updateButtonStates();
                document.getElementById('result-content').innerHTML = '旋轉中...';

                // 使用simulation.py的真實邏輯生成網格
                try {
                    const symbolGrid = this.generateGrid();
                    console.log('Raw symbolGrid from generateGrid:', symbolGrid);
                    
                    this.currentGrid = [];
                    
                    // 轉換數字索引為符號名稱
                    for (let reel = 0; reel < this.reels; reel++) {
                        this.currentGrid[reel] = [];
                        for (let row = 0; row < this.rows; row++) {
                            const symbolIndex = symbolGrid[reel][row];
                            console.log(`Converting reel ${reel}, row ${row}: index ${symbolIndex}`);
                            const symbolName = this.mapIndexToSymbol(symbolIndex);
                            console.log(`Mapped to symbol: ${symbolName}`);
                            this.currentGrid[reel][row] = symbolName;
                        }
                    }
                    
                    console.log('Final generated grid:', this.currentGrid);
                } catch (error) {
                    console.error('Grid generation failed, using fallback:', error);
                    // 回退到原始隨機生成
                    this.currentGrid = [];
                    for (let reel = 0; reel < this.reels; reel++) {
                        this.currentGrid[reel] = [];
                        for (let row = 0; row < this.rows; row++) {
                            this.currentGrid[reel][row] = this.getRandomSymbol();
                        }
                    }
                }

                // Initialize randomwild state (will be processed after reel animation)
                this.randomwildTriggered = false;
                this.randomwildUsed = false;
                this.goldenSymbolsConvertedThisRound = 0;

                // Store original grid for Hold & Spin check
                this.originalGrid = this.currentGrid.map(reel => [...reel]);

                // Start spinning animation
                await this.animateReels();

                // 在cascading wins之前進行randomwild抽選
                this.applyRandomwild();

                // Process cascading wins (randomwild will be checked during this process)
                await this.processCascadingWins();

                // Check for C1 scatter symbols and freegame trigger
                this.checkC1ScatterAndFreegame();

                this.isSpinning = false;
                this.updateButtonStates();
                this.updateGameStateDisplay();
                
                // Continue auto spin if enabled
                if (this.isAutoSpin) {
                    this.scheduleNextAutoSpin();
                }
            }

            checkC1ScatterAndFreegame() {
                // Count C1 symbols in current grid
                let currentC1Count = 0;
                for (let reel = 0; reel < this.reels; reel++) {
                    for (let row = 0; row < this.rows; row++) {
                        if (this.currentGrid[reel][row] === 'C1') {
                            currentC1Count++;
                        }
                    }
                }

                if (this.gamePhase === 'basegame') {
                    // In base game, use current C1 count (not accumulate)
                    this.c1Count = currentC1Count;
                    
                    if (this.c1Count >= 3) {
                        // Trigger freegame
                        this.triggerFreegame();
                    }
                } else if (this.gamePhase === 'freegame') {
                    // In freegame, C1s can retrigger more spins
                    if (currentC1Count >= 3) {
                        const additionalSpins = this.calculateRetriggerSpins(currentC1Count);
                        this.freeGameSpinsRemaining += additionalSpins;
                        console.log(`Freegame retrigger! +${additionalSpins} spins`);
                    }
                    
                    // Decrease remaining spins
                    this.freeGameSpinsRemaining--;
                    
                    if (this.freeGameSpinsRemaining <= 0) {
                        this.endFreegame();
                    }
                }
            }

            triggerFreegame() {
                console.log('🎰 [免費遊戲] 免費遊戲觸發! 當前畫面C1數量:', this.c1Count);
                
                // 取得當前這次旋轉的獲勝金額 (如果有的話)
                const currentSpinWin = this.lastSpinWin || 0; // 需要先設置這個變數
                
                this.gamePhase = 'freegame';
                this.freeGameSpinsRemaining = 10; // Standard 10 free spins
                this.c1Count = 0; // Reset for next base game session
                
                // 清理basegame記錄數據
                this.currentBasegameTableInfo = null;
                this.currentBasegameSymbolData = null;
                console.log('🎲 [基礎遊戲] 已清理basegame表記錄');
                
                // 重置freegame場次序列系統
                this.resetFreegameSequence();
                
                // 初始化免費遊戲總獲勝分數，包含觸發時的獲勝
                this.freeGameTotalWin = currentSpinWin;
                
                // 設置免費遊戲的 surface 數據
                this.currentFreeGameHighSurface = this.gameMode === 'yb' ? 
                    this.currentFreeGameSurface : this.freeGameSurface?.[3];
                console.log('🎰 [免費遊戲] 設置免費遊戲高表配置:', this.currentFreeGameHighSurface);
                console.log('🎰 [免費遊戲] 遊戲模式:', this.gameMode);
                console.log('🎰 [免費遊戲] 免費遊戲局數:', this.freeGameSpinsRemaining);
                
                // Update multiplier display for free game mode
                this.updateMultiplierDisplay();
                
                // No need to manually switch weights - freegame uses different data.js arrays
                // The generateFreegameGrid() function will use freeGameHighSymbolWeight and freeGameSymbolHigh arrays
                console.log('🎰 [免費遊戲] 切換到免費遊戲階段 - 將使用免費遊戲data.js陣列');
                
                // Display freegame start message
                const resultContent = document.getElementById('result-content');
                resultContent.innerHTML += '<div style="color: #ffd700; font-size: 1.3em; margin-top: 15px; animation: bigWinGlow 1s infinite;">🎰 免費遊戲開始！10局免費旋轉 🎰</div>';
            }

            calculateRetriggerSpins(c1Count) {
                // More C1s = more additional spins
                if (c1Count >= 5) return 15;
                if (c1Count >= 4) return 10;
                return 5; // 3 C1s
            }

            endFreegame() {
                console.log('Freegame ended');
                this.gamePhase = 'basegame';
                this.freeGameSpinsRemaining = 0;
                
                // 清理免費遊戲相關變數
                this.currentFreeGameHighSurface = null;
                
                // 重置freegame場次序列系統
                this.resetFreegameSequence();
                
                // 準備回到basegame，清理任何可能的basegame記錄
                this.currentBasegameTableInfo = null;
                this.currentBasegameSymbolData = null;
                console.log('🎲 [基礎遊戲] 已準備回到basegame模式');
                
                // Update multiplier display back to base game mode
                this.updateMultiplierDisplay();
                
                // 清理Buy Feature模式相關變數
                if (this.activeBuyFeatureMode) {
                    this.activeBuyFeatureMode = false;
                    this.buyFeatureFreegameHighSurface = null;
                    this.buyFeatureTableSchedule = null; // 清理表序列
                    this.currentBuyFeatureSpinIndex = 0; // 重置spin索引
                    this.buyFeatureSelectedSymbolMode = null; // 清理符號模式
                    console.log('🎰 [Buy Feature] Buy Feature模式已清理，表序列和符號模式已重置');
                }
                
                // Display freegame end message with total win
                const resultContent = document.getElementById('result-content');
                const isBigWin = this.freeGameTotalWin >= 5000; // 定義大獎門檻
                const winClass = isBigWin ? 'big-win' : '';
                const winAnimation = isBigWin ? 'animation: bigWinGlow 2s infinite;' : '';
                
                if (this.isBuyFeatureActive) {
                    resultContent.innerHTML += `<div style="color: #e74c3c; font-size: 1.2em; margin-top: 15px;">💎 Buy Feature免費遊戲結束，回到基礎遊戲 💎</div>`;
                    this.isBuyFeatureActive = false; // 重置Buy Feature狀態
                } else {
                    resultContent.innerHTML += `<div style="color: #e74c3c; font-size: 1.2em; margin-top: 15px;">免費遊戲結束，回到基礎遊戲</div>`;
                }
                
                // 顯示免費遊戲總獲勝金額
                resultContent.innerHTML += `<div class="${winClass}" style="color: #ffd700; font-size: 1.5em; font-weight: bold; margin-top: 10px; ${winAnimation}">🎰 免費遊戲總獲勝: ${this.freeGameTotalWin.toLocaleString()} 🎰</div>`;
                
                // 重置免費遊戲總分
                this.freeGameTotalWin = 0;
                
                // 重新設定基礎遊戲參數
                this.setupModeParameters();
                this.updateButtonStates();
            }

            buyFreegame() {
                if (this.gamePhase !== 'basegame') {
                    console.log('只能在基礎遊戲中購買特色');
                    return;
                }
                
                const cost = this.buyFeatureCost * this.currentBet; // 使用倍數計算：40.5倍押注
                if (this.balance < cost) {
                    console.log('餘額不足，無法購買特色');
                    return;
                }
                
                // 扣除費用
                this.balance -= cost;
                this.isBuyFeatureActive = true;
                
                console.log(`購買特色成功！花費: ${cost} (${this.buyFeatureCost}倍押注)`);
                const resultContent = document.getElementById('result-content');
                resultContent.innerHTML = '<div style="color: #9b59b6; font-size: 1.3em; animation: bigWinGlow 1s infinite;">💎 購買特色！產生全C1畫面... 💎</div>';
                
                this.updateDisplay();
                
                // 執行Buy Feature流程
                this.executeBuyFeature();
            }

            async executeBuyFeature() {
                try {
                    // Step 1: 產生全部都是C1的畫面
                    this.generateAllC1Grid();
                    
                    // 顯示全C1畫面
                    this.updateButtonStates();
                    await this.animateReels();
                    
                    // 顯示全C1結果
                    const resultContent = document.getElementById('result-content');
                    resultContent.innerHTML = '<div style="color: #ffd700; font-size: 1.3em; margin-bottom: 10px;">🎰 全畫面C1！觸發Buy Feature免費遊戲！ 🎰</div>';
                    
                    // 等待玩家看到結果 (縮短等待時間)
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    // Step 2: 進入免費遊戲模式
                    this.gamePhase = 'freegame';
                    this.freeGameSpinsRemaining = 10; // 預設10局免費遊戲
                    this.c1Count = 0; // 重置C1計數
                    this.isBuyFeatureActive = false;
                    
                    // 初始化免費遊戲總獲勝分數 (Buy Feature沒有觸發獎勝，從0開始)
                    this.freeGameTotalWin = 0;
                    
                    // 設置免費遊戲的 surface 數據 - 統一使用currentFreeGameSurface
                    this.currentFreeGameHighSurface = this.gameMode === 'yb' ? 
                        this.currentFreeGameSurface : this.freeGameSurface?.[3];
                    
                    // 設定Buy Feature專用的免費遊戲參數
                    this.setupBuyFeatureFreegameParameters();
                    
                    // 顯示免費遊戲開始
                    resultContent.innerHTML += '<div style="color: #ffd700; font-size: 1.2em; margin-top: 15px;">🌟 Buy Feature免費遊戲開始！🌟</div>';
                    
                    this.updateGameStateDisplay();
                    this.updateButtonStates();
                    
                } catch (error) {
                    console.error('Buy Feature執行失敗:', error);
                    this.isBuyFeatureActive = false;
                    this.updateButtonStates();
                }
            }

            generateAllC1Grid() {
                // 產生5x4全部都是C1的畫面
                this.currentGrid = [];
                for (let reel = 0; reel < this.reels; reel++) {
                    this.currentGrid[reel] = [];
                    for (let row = 0; row < this.rows; row++) {
                        this.currentGrid[reel][row] = 'C1';
                    }

                console.log('產生全C1畫面:', this.currentGrid);

            generateBuyFeatureTableScheduleFromMatrix() {
                // 雙層抽選機制：第一層選擇符號模式，第二層選擇高低表分配
                console.log('🎰 [Buy Feature] 開始雙層抽選機制');
                console.log('🎰 [Buy Feature] 輸入矩陣:', this.buyFeatureFreegameHighSurface);
                
                // === 第一層抽選：選擇符號模式 ===
                // 計算每一行的總權重，決定使用哪一行
                const rowWeights = this.buyFeatureFreegameHighSurface.map(row => 
                    row.reduce((sum, val) => sum + val, 0)
                );
                
                console.log('🎯 [第一層抽選] 各行總權重:', {
                    '第1行(AKQJ混合)': rowWeights[0],
                    '第2行(純A)': rowWeights[1], 
                    '第3行(純K)': rowWeights[2],
                    '第4行(純Q)': rowWeights[3],
                    '第5行(純J)': rowWeights[4]
                });
                
                // 根據行權重選擇符號模式
                const selectedRowIndex = this.weightedRandomChoice(rowWeights);
                const symbolModeNames = ['AKQJ混合', '純A', '純K', '純Q', '純J'];
                const selectedSymbolMode = symbolModeNames[selectedRowIndex];
                
                console.log('🎯 [第一層抽選] ✅ 選中符號模式:', {
                    rowIndex: selectedRowIndex,
                    symbolMode: selectedSymbolMode,
                    rowWeight: rowWeights[selectedRowIndex]
                });
                
                // 儲存選中的符號模式，供後續使用
                this.buyFeatureSelectedSymbolMode = {
                    rowIndex: selectedRowIndex,
                    symbolMode: selectedSymbolMode
                };
                
                // === 第二層抽選：在選中行內選擇高低表分配 ===
                const selectedRow = this.buyFeatureFreegameHighSurface[selectedRowIndex];
                
                console.log('🎯 [第二層抽選] 選中行的權重分配:', selectedRow);
                console.log('🎯 [第二層抽選] 權重說明:', {
                    '索引0': '0場高表/10場低表',
                    '索引1': '1場高表/9場低表',
                    '索引2': '2場高表/8場低表', 
                    '索引3': '3場高表/7場低表',
                    '索引4': '4場高表/6場低表',
                    '索引5': '5場高表/5場低表',
                    '索引6': '6場高表/4場低表',
                    '索引7': '7場高表/3場低表',
                    '索引8': '8場高表/2場低表',
                    '索引9': '9場高表/1場低表',
                    '索引10': '10場高表/0場低表'
                });
                
                // 根據選中行的權重分配選擇高低表場次
                const selectedTableDistributionIndex = this.weightedRandomChoice(selectedRow);
                const highTableSpins = selectedTableDistributionIndex;
                const lowTableSpins = 10 - highTableSpins;
                
                console.log('� [第二層抽選] ✅ 高低表分配結果:', {
                    distributionIndex: selectedTableDistributionIndex,
                    highTableSpins: `${highTableSpins}場高表`,
                    lowTableSpins: `${lowTableSpins}場低表`,
                    weight: selectedRow[selectedTableDistributionIndex],
                    finalDistribution: `${highTableSpins}高/${lowTableSpins}低`
                });
                
                // 生成10場免費遊戲的表類型序列 (true=高表, false=低表)
                const tableSchedule = [];
                
                // 先添加指定數量的高表
                for (let i = 0; i < highTableSpins; i++) {
                    tableSchedule.push(true);
                }
                
                // 再添加剩餘的低表
                for (let i = 0; i < lowTableSpins; i++) {
                    tableSchedule.push(false);
                }
                
                // 隨機打亂順序，模擬真實遊戲中的隨機分佈
                this.shuffleArray(tableSchedule);

            shuffleArray(array) {
                // Fisher-Yates 洗牌算法
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            toggleAutoSpin() {
                if (this.isAutoSpin) {
                    this.stopAutoSpin();
                } else {
                    this.startAutoSpin();
                }
            }

            startAutoSpin() {
                if (this.isSpinning) return;
                
                this.isAutoSpin = true;
                this.updateButtonStates();
                this.scheduleNextAutoSpin();
            }

            stopAutoSpin() {
                this.isAutoSpin = false;
                if (this.autoSpinInterval) {
                    clearTimeout(this.autoSpinInterval);
                    this.autoSpinInterval = null;
                }
                this.updateButtonStates();
            }

            scheduleNextAutoSpin() {
                if (!this.isAutoSpin || this.balance < this.currentBet) {
                    this.stopAutoSpin();
                    return;
                }
                
                // Wait 2 seconds before next spin
                this.autoSpinInterval = setTimeout(() => {
                    if (this.isAutoSpin && !this.isSpinning) {
                        this.spin();
                    }
                }, 2000);
            }

            updateButtonStates() {
                const spinBtn = document.getElementById('spin-btn');
                const autoBtn = document.getElementById('auto-btn');
                const betPlusBtn = document.getElementById('bet-plus');
                const betMinusBtn = document.getElementById('bet-minus');
                const buyBtn = document.getElementById('buy-feature-btn');
                
                // Update spin button
                spinBtn.disabled = this.isSpinning || this.isAutoSpin || this.isBuyFeatureActive;
                
                // Update auto button
                autoBtn.disabled = this.isSpinning || this.isBuyFeatureActive;
                if (this.isAutoSpin) {
                    autoBtn.textContent = '停止';
                    autoBtn.classList.add('active');
                } else {
                    autoBtn.textContent = '自動';
                    autoBtn.classList.remove('active');
                }
                
                // Update bet buttons
                betPlusBtn.disabled = this.isSpinning || this.isAutoSpin || this.isBuyFeatureActive;
                betMinusBtn.disabled = this.isSpinning || this.isAutoSpin || this.isBuyFeatureActive;
                
                // Update buy feature button
                if (buyBtn) {
                    const cost = this.buyFeatureCost; // 使用固定金額
                    const canAfford = this.balance >= cost;
                    const inBasegame = this.gamePhase === 'basegame';
                    
                    buyBtn.disabled = this.isSpinning || this.isAutoSpin || this.isBuyFeatureActive || 
                                     !canAfford || !inBasegame;
                    
                    // Update button text to show cost
                    buyBtn.textContent = `購買特色 (${cost})`;
                    
                    // Visual feedback for affordability
                    if (!canAfford && inBasegame) {
                        buyBtn.style.opacity = '0.5';
                        buyBtn.title = '餘額不足';
                    } else if (!inBasegame) {
                        buyBtn.style.opacity = '0.5';
                        buyBtn.title = '只能在基礎遊戲中購買';
                    } else {
                        buyBtn.style.opacity = '1';
                        buyBtn.title = `花費 ${cost} 購買免費遊戲特色`;
                    }
                }
            }

            async processCascadingWins() {
                let totalPayout = 0;
                let allResults = [];

                while (true) {
                    // Calculate results for current grid
                    const result = this.calculateWays();
                    
                    if (result.winningWays.length === 0) {
                        break; // No more wins, stop cascading
                    }

                    // Apply cascade multiplier
                    this.cascadeMultiplier = this.getCascadeMultiplier(this.cascadeCount);
                    this.updateMultiplierDisplay();
                    
                    // Apply multiplier to payout
                    const multipliedPayout = result.totalPayout * this.cascadeMultiplier;
                    totalPayout += multipliedPayout;
                    
                    // Store result with multiplier info
                    result.multiplier = this.cascadeMultiplier;
                    result.multipliedPayout = multipliedPayout;
                    allResults.push(result);

                    // Highlight winning symbols
                    this.highlightWinningSymbols(result.winningWays);
                    
                    // Show current win results
                    this.displayResults(result);
                    
                    // Wait for player to see the win (縮短等待時間)
                    await new Promise(resolve => setTimeout(resolve, 800));

                    // All symbols can be removed in cascading wins
                    if (result.winningWays.length === 0) {
                        break; // No wins to process
                    }

                    // Remove winning symbols
                    await this.removeWinningSymbols(result.winningWays);
                    
                    // Drop new symbols
                    await this.dropNewSymbols();
                    
                    // Increment cascade count for next iteration
                    this.cascadeCount++;
                }

                // Add total payout to balance
                this.balance += totalPayout;
                
                // 記錄這次旋轉的獲勝金額
                this.lastSpinWin = totalPayout;
                
                // 處理免費遊戲分數累計
                if (this.gamePhase === 'freegame') {
                    this.freeGameTotalWin += totalPayout;
                }
                
                this.updateDisplay();

                // Display final results
                this.displayFinalResults(allResults, totalPayout);
            }

                for (let reel = 0; reel < this.reels; reel++) {
                    promises.push(this.animateReel(reel, 1000 + reel * 200));

                await Promise.all(promises);

            calculateWays() {
                const result = {
                    winningWays: [],
                    totalPayout: 0,
                    scatterCount: 0
                };

                // Calculate regular ways - only check base symbols (not golden versions or WILD)
                const baseSymbols = ['M1', 'M2', 'M3', 'M4', 'A', 'K', 'Q', 'J'];
                for (const symbol of baseSymbols) {

                    let consecutiveReels = 0;
                    let waysMultiplier = 1;
                    let hasGoldenSymbols = false;

                    for (let reel = 0; reel < this.reels; reel++) {
                        const symbolCount = this.countSymbolInReel(reel, symbol);
                        
                        if (symbolCount > 0) {
                            consecutiveReels++;
                            waysMultiplier *= symbolCount;
                            
                            // Check if this reel has golden symbols contributing
                            for (let row = 0; row < this.rows; row++) {
                                const currentSymbol = this.currentGrid[reel][row];
                                if (currentSymbol === symbol + '_G') {
                                    hasGoldenSymbols = true;
                                }
                            }
                        } else {
                            break;
                        }
                    }

                    if (consecutiveReels >= 3) {
                        const payout = waysMultiplier * this.getSymbolValue(symbol, consecutiveReels);
                        result.winningWays.push({
                            symbol,
                            consecutiveReels,
                            ways: waysMultiplier,
                            payout,
                            hasGoldenSymbols
                        });
                        result.totalPayout += payout;
                    }
                }


                return result;
            }

            getSymbolValue(symbol, consecutiveReels) {
                // Use linkpoint parameter for symbol values
                if (!this.linkpoint) {
                    // Fallback values if linkpoint not available
                    const fallbackValues = {
                        'M1': 1000, 'M2': 500, 'M3': 250, 'M4': 125,
                        'A': 75, 'K': 50, 'Q': 25, 'J': 10
                    };
                    return fallbackValues[symbol] || 10;
                }
                
                // Get symbol index in the linkpoint array
                const symbolIndex = this.symbolOrder.indexOf(symbol);
                if (symbolIndex === -1) return 10; // Fallback
                
                // linkpoint structure: [3 reels values, 4 reels values, 5 reels values]
                // consecutiveReels: 3, 4, 5 -> linkpoint index: 0, 1, 2
                const linkpointIndex = Math.min(consecutiveReels - 3, 2);
                
                return this.linkpoint[linkpointIndex][symbolIndex] * this.currentBet / 100;
            }

            countSymbolInReel(reelIndex, targetSymbol) {
                let count = 0;
                const targetBase = this.getBaseSymbol(targetSymbol);
                
                for (let row = 0; row < this.rows; row++) {
                    const symbol = this.currentGrid[reelIndex][row];
                    const symbolBase = this.getBaseSymbol(symbol);
                    
                    // Count if symbol matches target (regular or golden version) or is WILD/WILD2
                    if (symbolBase === targetBase || symbol === 'WILD' || symbol === 'WILD2') {
                        count++;
                    }
                }
                return count;
            }


            displayResults(result) {
                const resultContent = document.getElementById('result-content');
                
                if (result.winningWays.length === 0) {
                    let html = '<div style="color: #7f8c8d;">本局沒有中獎</div>';
                    
                    // Show randomwild info even if no wins
                    if (this.randomwildTriggered) {
                        html += '<div style="color: #ff6b9d; margin-top: 10px; font-weight: bold;">⭐ Randomwild 特色觸發 ⭐</div>';
                    }
                    
                    resultContent.innerHTML = html;
                    return;
                }

                let html = '';
                
                // Show randomwild notification
                if (this.randomwildTriggered) {
                    html += `<div style="color: #ff6b9d; font-size: 1.1em; margin-bottom: 10px; text-align: center; font-weight: bold;">⭐ Randomwild 特色觸發 ⭐</div>`;
                }
                
                // Show multiplier if it exists
                if (result.multiplier && result.multiplier > 1) {
                    html += `<div style="color: #ffd700; font-size: 1.2em; margin-bottom: 10px; text-align: center;">連鎖倍數: X${result.multiplier}</div>`;
                }
                
                result.winningWays.forEach(way => {
                    const isBigWin = way.payout >= 1000;
                    const hasGoldenContribution = way.hasGoldenSymbols;
                    const finalPayout = result.multiplier ? way.payout * result.multiplier : way.payout;
                    
                    html += `
                        <div class="win-line ${isBigWin ? 'big-win' : ''} ${hasGoldenContribution ? 'golden-symbol' : ''}">
                            <span>${way.symbol}${hasGoldenContribution ? '+G' : ''} x${way.consecutiveReels}</span>
                            <span>${way.ways} ways</span>
                            <span style="color: #ffd700; font-weight: bold;">${finalPayout.toLocaleString()}</span>
                        </div>
                    `;
                });

                const finalTotalPayout = result.multipliedPayout || result.totalPayout;
                if (finalTotalPayout >= 2000) {
                    html += `<div style="color: #e74c3c; font-size: 1.2em; margin-top: 10px; animation: bigWinGlow 1s infinite;">🎉 大獎中獎！ 🎉</div>`;
                }

                resultContent.innerHTML = html;
            }

            highlightWinningSymbols(winningWays) {
                // Remove previous highlights
                document.querySelectorAll('.winning-symbol').forEach(el => {
                    el.classList.remove('winning-symbol');
                });

                // Add new highlights
                winningWays.forEach(way => {
                    this.highlightWaySymbols(way.symbol, way.consecutiveReels);
                });
            }

            highlightWaySymbols(symbol, consecutiveReels) {
                for (let reel = 0; reel < consecutiveReels; reel++) {
                    const symbolsContainer = document.getElementById(`symbols-${reel}`);
                    const reelGroup = symbolsContainer.children[0];
                    
                    if (reelGroup) {
                        for (let row = 0; row < this.rows; row++) {
                            const currentSymbol = this.currentGrid[reel][row];
                            const currentBase = this.getBaseSymbol(currentSymbol);
                            const symbolBase = this.getBaseSymbol(symbol);
                            
                            // Highlight if symbol matches (regular/golden version) or is WILD
                            if (currentBase === symbolBase || currentSymbol === 'WILD') {
                                // Find the correct symbol element in the reel group
                                const symbolElement = this.findSymbolElementAtPosition(reelGroup, row);
                                if (symbolElement) {
                                    symbolElement.classList.add('winning-symbol');
                                }
                            }
                        }
                    }
                }
            }


            findSymbolElementAtPosition(reelGroup, targetRow) {
                // After ensureCleanReelStructure, DOM should have exactly 4 elements in order
                if (reelGroup && reelGroup.children.length === 4 && targetRow >= 0 && targetRow < 4) {
                    return reelGroup.children[targetRow];
                }
                
                console.warn(`Invalid symbol lookup: reelGroup has ${reelGroup ? reelGroup.children.length : 0} children, looking for row ${targetRow}`);
                return null;
            }

            async removeWinningSymbols(winningWays) {
                // Mark symbols for removal and transformation
                const symbolsToRemove = [];
                const symbolsToTransform = [];
                
                for (const way of winningWays) {
                    const wayBase = this.getBaseSymbol(way.symbol);
                    
                    // Mark winning symbols for removal or transformation
                    for (let reel = 0; reel < way.consecutiveReels; reel++) {
                        for (let row = 0; row < this.rows; row++) {
                            const currentSymbol = this.currentGrid[reel][row];
                            const currentBase = this.getBaseSymbol(currentSymbol);
                            
                            // If symbol matches the winning way (regular, golden, WILD, or WILD2)
                            if (currentBase === wayBase || currentSymbol === 'WILD' || currentSymbol === 'WILD2') {
                                if (currentSymbol.endsWith('_G')) {
                                    // Only golden symbols transform to WILD2
                                    symbolsToTransform.push({reel, row});
                                } else {
                                    // Regular symbols, WILD, and WILD2 are always removed
                                    symbolsToRemove.push({reel, row});
                                }
                            }
                        }
                    }
                }

                // Remove duplicate positions
                const uniqueRemovePositions = symbolsToRemove.filter((pos, index, self) => 
                    index === self.findIndex(p => p.reel === pos.reel && p.row === pos.row)
                );
                const uniqueTransformPositions = symbolsToTransform.filter((pos, index, self) => 
                    index === self.findIndex(p => p.reel === pos.reel && p.row === pos.row)
                );

                // Animate removal of regular symbols and WILD
                for (const pos of uniqueRemovePositions) {
                    const symbolsContainer = document.getElementById(`symbols-${pos.reel}`);
                    const reelGroup = symbolsContainer.children[0];
                    
                    if (reelGroup && reelGroup.children[pos.row]) {
                        const symbolElement = reelGroup.children[pos.row];
                        symbolElement.style.transition = 'all 0.5s ease-out';
                        symbolElement.style.transform = 'scale(0)';
                        symbolElement.style.opacity = '0';
                        
                        // Mark as removed in grid
                        this.currentGrid[pos.reel][pos.row] = null;
                    }
                }

                // Transform golden symbols to WILD first (will convert to WILD2 if randomwild triggers)
                let goldenSymbolsConverted = 0;
                const convertedPositions = []; // Track positions for potential WILD2 conversion
                
                for (const pos of uniqueTransformPositions) {
                    const symbolsContainer = document.getElementById(`symbols-${pos.reel}`);
                    const reelGroup = symbolsContainer.children[0];
                    
                    if (reelGroup && reelGroup.children[pos.row]) {
                        const symbolElement = reelGroup.children[pos.row];
                        
                        // Transform to WILD in grid first
                        this.currentGrid[pos.reel][pos.row] = 'WILD';
                        goldenSymbolsConverted++;
                        convertedPositions.push({reel: pos.reel, row: pos.row, element: symbolElement});
                        
                        // Update visual element to WILD
                        symbolElement.className = 'symbol WILD';
                        symbolElement.style.transition = 'all 0.5s ease-out';
                        symbolElement.style.transform = 'scale(1.1)';
                        
                        // Update image to WILD
                        const img = symbolElement.querySelector('img');
                        if (img) {
                            const newImg = this.createSymbolImage('WILD');
                            symbolElement.replaceChild(newImg, img);
                        }
                        
                        // Reset transform after animation
                        setTimeout(() => {
                            symbolElement.style.transform = 'scale(1)';
                        }, 500);
                    }
                }

                // Update golden symbols converted count
                this.goldenSymbolsConvertedThisRound += goldenSymbolsConverted;
                if (goldenSymbolsConverted > 0) {
                    console.log(`🏆 轉換了 ${goldenSymbolsConverted} 個黃金符號為 WILD，本輪總計: ${this.goldenSymbolsConvertedThisRound}`);
                }

                // Wait for animations to complete
                await new Promise(resolve => setTimeout(resolve, 500));

                // 暫存轉換信息，randomwild將在新符號落下後處理
                if (goldenSymbolsConverted > 0) {
                    this.pendingRandomwildCheck = {
                        convertedPositions: convertedPositions,
                        goldenSymbolsConverted: goldenSymbolsConverted
                    };
                }
            }

            async dropNewSymbols() {
                const promises = [];
                
                for (let reel = 0; reel < this.reels; reel++) {
                    promises.push(this.dropNewSymbolsInReel(reel));
                }
                
                await Promise.all(promises);
                
                // 新符號落下完成後，檢查是否需要處理randomwild
                if (this.pendingRandomwildCheck) {
                    console.log('🌟 新符號落下完成，開始處理randomwild');
                    
                    const originalWildPositions = this.findOriginalWildPositions();
                    const randomwildTriggered = this.checkAndApplyRandomwild(originalWildPositions);
                    
                    // 如果randomwild觸發，將剛轉換的WILD改為WILD2以示區別
                    if (randomwildTriggered && this.pendingRandomwildCheck.convertedPositions) {
                        this.convertWildToWild2(this.pendingRandomwildCheck.convertedPositions);
                    }
                    
                    // 清理暫存信息
                    this.pendingRandomwildCheck = null;
                }
            }

            findOriginalWildPositions() {
                // 找到原本就是WILD的位置（在旋轉開始時就存在的）
                const originalWildPositions = [];
                
                // 這個函數需要在旋轉開始時記錄原始WILD位置
                // 暫時返回空數組，因為我們主要關心的是避免從黃金符號轉換的WILD
                return originalWildPositions;
            }

            async dropNewSymbolsInReel(reelIndex) {
                const symbolsContainer = document.getElementById(`symbols-${reelIndex}`);
                const reelGroup = symbolsContainer.children[0];
                
                if (!reelGroup) return;

                // Analyze current grid state
                const existingSymbols = [];
                const emptyPositions = [];
                
                // Collect existing symbols and identify empty positions
                for (let row = 0; row < this.rows; row++) {
                    if (this.currentGrid[reelIndex][row] !== null) {
                        existingSymbols.push({
                            symbol: this.currentGrid[reelIndex][row],
                            originalRow: row
                        });
                    } else {
                        emptyPositions.push(row);
                    }
                }
                
                // If no symbols were removed, no need to animate
                if (emptyPositions.length === 0) return;
                
                // Calculate how symbols should move down
                const finalGrid = new Array(this.rows);
                const symbolsToAnimate = [];
                
                // Fill from bottom up with existing symbols
                let existingIndex = existingSymbols.length - 1;
                for (let row = this.rows - 1; row >= 0; row--) {
                    if (existingIndex >= 0) {
                        finalGrid[row] = existingSymbols[existingIndex].symbol;
                        
                        // Check if symbol needs to move
                        const originalRow = existingSymbols[existingIndex].originalRow;
                        if (originalRow !== row) {
                            symbolsToAnimate.push({
                                symbol: existingSymbols[existingIndex].symbol,
                                fromRow: originalRow,
                                toRow: row,
                                isMoving: true
                            });
                        } else {
                            symbolsToAnimate.push({
                                symbol: existingSymbols[existingIndex].symbol,
                                fromRow: originalRow,
                                toRow: row,
                                isMoving: false
                            });
                        }
                        existingIndex--;
                    } else {
                        // Generate new symbol for empty position using proper reel sampling
                        const newSymbol = this.generateNewSymbolForReel(reelIndex);
                        finalGrid[row] = newSymbol;
                        symbolsToAnimate.push({
                            symbol: newSymbol,
                            fromRow: -1, // Coming from above
                            toRow: row,
                            isNew: true
                        });
                    }
                }
                
                // Update grid
                this.currentGrid[reelIndex] = finalGrid;
                
                // Create final reel group with all symbols in correct positions
                await this.createFinalReelGroup(reelIndex, symbolsToAnimate);
            }
            
            async createFinalReelGroup(reelIndex, symbolsToAnimate) {
                const symbolsContainer = document.getElementById(`symbols-${reelIndex}`);
                const originalReelGroup = symbolsContainer.children[0];
                
                // Create new reel group immediately to avoid flashing
                const newReelGroup = document.createElement('div');
                newReelGroup.style.position = 'absolute';
                newReelGroup.style.width = '100%';
                newReelGroup.style.height = '480px';
                newReelGroup.style.top = '0';
                newReelGroup.style.left = '0';
                
                // Create all symbols in their current positions first
                const stationarySymbols = symbolsToAnimate.filter(s => !s.isMoving && !s.isNew);
                const movingSymbols = symbolsToAnimate.filter(s => s.isMoving);
                const newSymbols = symbolsToAnimate.filter(s => s.isNew);
                
                // Add stationary symbols first (no animation needed)
                for (const symbolInfo of stationarySymbols) {
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = `symbol ${symbolInfo.symbol}`;
                    symbolDiv.style.position = 'absolute';
                    symbolDiv.style.top = `${symbolInfo.toRow * 120}px`;
                    symbolDiv.style.width = '100%';
                    symbolDiv.style.height = '120px';
                    symbolDiv.style.display = 'flex';
                    symbolDiv.style.alignItems = 'center';
                    symbolDiv.style.justifyContent = 'center';
                    symbolDiv.style.borderBottom = '1px solid #333';
                    symbolDiv.style.background = 'linear-gradient(45deg, #1a1a1a, #2a2a2a)';
                    symbolDiv.style.overflow = 'hidden';
                    
                    const img = this.createSymbolImage(symbolInfo.symbol);
                    symbolDiv.appendChild(img);
                    
                    newReelGroup.appendChild(symbolDiv);
                }
                
                // Add moving symbols at their original positions, then animate
                for (const symbolInfo of movingSymbols) {
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = `symbol ${symbolInfo.symbol}`;
                    symbolDiv.style.position = 'absolute';
                    symbolDiv.style.top = `${symbolInfo.fromRow * 120}px`;
                    symbolDiv.style.width = '100%';
                    symbolDiv.style.height = '120px';
                    symbolDiv.style.display = 'flex';
                    symbolDiv.style.alignItems = 'center';
                    symbolDiv.style.justifyContent = 'center';
                    symbolDiv.style.borderBottom = '1px solid #333';
                    symbolDiv.style.background = 'linear-gradient(45deg, #1a1a1a, #2a2a2a)';
                    symbolDiv.style.overflow = 'hidden';
                    symbolDiv.style.transition = 'top 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    
                    const img = this.createSymbolImage(symbolInfo.symbol);
                    symbolDiv.appendChild(img);
                    
                    newReelGroup.appendChild(symbolDiv);
                }
                
                // Add new symbols above the visible area
                for (const symbolInfo of newSymbols) {
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = `symbol ${symbolInfo.symbol}`;
                    symbolDiv.style.position = 'absolute';
                    symbolDiv.style.top = `${-120 - (newSymbols.indexOf(symbolInfo) * 120)}px`; // Start above visible area
                    symbolDiv.style.width = '100%';
                    symbolDiv.style.height = '120px';
                    symbolDiv.style.display = 'flex';
                    symbolDiv.style.alignItems = 'center';
                    symbolDiv.style.justifyContent = 'center';
                    symbolDiv.style.borderBottom = '1px solid #333';
                    symbolDiv.style.background = 'linear-gradient(45deg, #1a1a1a, #2a2a2a)';
                    symbolDiv.style.overflow = 'hidden';
                    symbolDiv.style.transition = 'top 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    
                    const img = this.createSymbolImage(symbolInfo.symbol);
                    symbolDiv.appendChild(img);
                    
                    newReelGroup.appendChild(symbolDiv);
                }
                
                // Replace the old reel group
                symbolsContainer.innerHTML = '';
                symbolsContainer.appendChild(newReelGroup);
                
                // Start animations after a brief delay
                setTimeout(() => {
                    // Animate moving symbols
                    movingSymbols.forEach((symbolInfo, index) => {
                        const symbolElement = newReelGroup.children[stationarySymbols.length + index];
                        if (symbolElement) {
                            symbolElement.style.top = `${symbolInfo.toRow * 120}px`;
                        }
                    });
                    
                    // Animate new symbols
                    newSymbols.forEach((symbolInfo, index) => {
                        const symbolElement = newReelGroup.children[stationarySymbols.length + movingSymbols.length + index];
                        if (symbolElement) {
                            symbolElement.style.top = `${symbolInfo.toRow * 120}px`;
                        }
                    });
                }, 50);
                
                // Wait for animations to complete
                const maxDuration = Math.max(
                    movingSymbols.length > 0 ? 600 : 0,
                    newSymbols.length > 0 ? 800 : 0
                );
                await new Promise(resolve => setTimeout(resolve, maxDuration + 100));
                
                // Clean up and ensure proper structure after animations
                this.ensureCleanReelStructure(reelIndex);
            }
            
            ensureCleanReelStructure(reelIndex) {
                const symbolsContainer = document.getElementById(`symbols-${reelIndex}`);
                const reelGroup = symbolsContainer.children[0];
                
                if (!reelGroup) return;
                
                // Create a clean reel group with exactly 4 symbols in order
                const cleanReelGroup = document.createElement('div');
                cleanReelGroup.style.position = 'absolute';
                cleanReelGroup.style.width = '100%';
                cleanReelGroup.style.height = '480px';
                cleanReelGroup.style.top = '0';
                cleanReelGroup.style.left = '0';
                
                // Create symbols in correct order based on currentGrid
                for (let row = 0; row < this.rows; row++) {
                    const symbol = this.currentGrid[reelIndex][row];
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = `symbol ${symbol}`;
                    symbolDiv.style.position = 'absolute';
                    symbolDiv.style.top = `${row * 120}px`;
                    symbolDiv.style.width = '100%';
                    symbolDiv.style.height = '120px';
                    symbolDiv.style.display = 'flex';
                    symbolDiv.style.alignItems = 'center';
                    symbolDiv.style.justifyContent = 'center';
                    symbolDiv.style.borderBottom = '1px solid #333';
                    symbolDiv.style.background = 'linear-gradient(45deg, #1a1a1a, #2a2a2a)';
                    symbolDiv.style.overflow = 'hidden';
                    
                    const img = this.createSymbolImage(symbol);
                    symbolDiv.appendChild(img);
                    
                    cleanReelGroup.appendChild(symbolDiv);
                }
                
                // Replace the existing reel group
                symbolsContainer.innerHTML = '';
                symbolsContainer.appendChild(cleanReelGroup);
            }

            displayFinalResults(allResults, totalPayout) {
                const resultContent = document.getElementById('result-content');
                
                if (allResults.length === 0) {
                    resultContent.innerHTML = '<div style="color: #7f8c8d;">本局沒有中獎</div>';
                    return;
                }

                let html = `<div style="color: #ffd700; font-size: 1.1em; margin-bottom: 10px;">連鎖獲勝 x${allResults.length}</div>`;
                
                allResults.forEach((result, index) => {
                    html += `<div style="margin-bottom: 10px; padding: 5px; background: rgba(255,255,255,0.05); border-radius: 5px;">`;
                    html += `<div style="color: #ffd700; font-size: 0.9em;">第 ${index + 1} 次獲勝 (X${result.multiplier || 1}):</div>`;
                    
                    result.winningWays.forEach(way => {
                        const isBigWin = way.payout >= 1000;
                        const hasGoldenContribution = way.hasGoldenSymbols;
                        const finalPayout = result.multiplier ? way.payout * result.multiplier : way.payout;
                        
                        html += `
                            <div class="win-line ${isBigWin ? 'big-win' : ''} ${hasGoldenContribution ? 'golden-symbol' : ''}" style="margin: 2px 0;">
                                <span>${way.symbol}${hasGoldenContribution ? '+G' : ''} x${way.consecutiveReels}</span>
                                <span>${way.ways} ways</span>
                                <span style="color: #ffd700; font-weight: bold;">${finalPayout.toLocaleString()}</span>
                            </div>
                        `;
                    });
                    html += `</div>`;
                });

                if (totalPayout >= 2000) {
                    html += `<div style="color: #e74c3c; font-size: 1.3em; margin-top: 10px; animation: bigWinGlow 1s infinite;">🎉 超級大獎！總獲勝: ${totalPayout.toLocaleString()} 🎉</div>`;
                } else {
                    html += `<div style="color: #ffd700; font-size: 1.1em; margin-top: 10px;">總獲勝: ${totalPayout.toLocaleString()}</div>`;
                }
                
                // 在免費遊戲期間顯示累計總分
                if (this.gamePhase === 'freegame') {
                    html += `<div style="color: #ff6b6b; font-size: 1.2em; font-weight: bold; margin-top: 10px; border: 2px solid #ff6b6b; padding: 5px; border-radius: 5px;">🎰 免費遊戲累計: ${this.freeGameTotalWin.toLocaleString()} (剩餘 ${this.freeGameSpinsRemaining} 局) 🎰</div>`;
                }

                resultContent.innerHTML = html;
            }


            updateDisplay() {
                // 確保餘額是數值
                if (isNaN(this.balance) || this.balance === undefined || this.balance === null) {
                    console.error('餘額不是數值，重置為0:', this.balance);
                    this.balance = 0;
                }
                
                document.getElementById('balance').textContent = this.balance.toLocaleString();
                document.getElementById('bet').textContent = this.currentBet.toLocaleString();
                
                // 在免費遊戲期間顯示累計總獲勝，基礎遊戲顯示當前旋轉獲勝
                if (this.gamePhase === 'freegame') {
                    document.getElementById('win').textContent = this.freeGameTotalWin.toLocaleString();
                } else {
                    // 基礎遊戲顯示當前旋轉的獲勝金額
                    document.getElementById('win').textContent = (this.lastSpinWin || 0).toLocaleString();
                }
                
                this.updateGameStateDisplay();
            }
        }

        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new WayGameSlot();
        });
    </script>
</body>
