<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊戲大廳 | Slot Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #1e2130;
      --border: rgba(255,255,255,0.08);
      --accent: #7c6ef2;
      --text: #e8eaf0;
      --muted: #7a7f9a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.25rem; }
    .user-info { display: flex; align-items: center; gap: 16px; font-size: 0.9rem; color: var(--muted); }
    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 6px 14px;
    }
    .logout-btn:hover { border-color: var(--accent); color: var(--accent); }
    main { padding: 40px; }
    h2 { font-size: 1.1rem; margin-bottom: 24px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .game-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .thumb {
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1e2130, #2a2d40);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .game-info { padding: 14px; }
    .game-info h3 { font-size: 0.95rem; margin-bottom: 4px; }
    .game-info p { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Slot Portal</h1>
    <div class="user-info">
      <span id="username">載入中...</span>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </div>
  </header>
  <main>
    <h2>選擇遊戲</h2>
    <div class="grid" id="gameGrid"></div>
  </main>

  <script>
    const games = [
      { id: 'demo1', name: '瘋狂果醬罐', desc: 'Crazy Jam Jar', icon: '🍓' },
      { id: 'demo2', name: 'Sugar Bang Bang', desc: 'Candy Slot', icon: '🍬' },
      { id: 'demo3', name: 'Sugar Rush', desc: 'Base Game Demo', icon: '🍭' },
      { id: 'demo4', name: 'Way Game', desc: 'Slot Machine', icon: '🎰' },
      { id: 'demo5', name: '財富大盛', desc: 'Fortune Slot', icon: '💰' },
    ];

    async function init() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) { window.location.href = '/login.html'; return; }
        const data = await res.json();
        document.getElementById('username').textContent = data.username;
      } catch {
        window.location.href = '/login.html';
      }

      const grid = document.getElementById('gameGrid');
      games.forEach(g => {
        grid.innerHTML += `
          <a class="game-card" href="/games/${g.id}/">
            <div class="thumb">${g.icon}</div>
            <div class="game-info">
              <h3>${g.name}</h3>
              <p>${g.desc}</p>
            </div>
          </a>`;
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    init();
  </script>
</body>
</html>
